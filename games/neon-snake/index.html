<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Neon Snake 2049 - games.utility.forum</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #060810;
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      touch-action: none;
    }
    #gameContainer {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 440px;
      padding: 10px 16px;
      background: rgba(18, 22, 38, 0.8);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px 12px 0 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
    }
    .hud span { color: #00f0ff; font-weight: bold; }
    canvas {
      background: #090c18;
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-top: none;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
      image-rendering: pixelated;
    }
    .overlay {
      position: absolute;
      inset: 45px 0 0 0;
      background: rgba(6, 8, 16, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 0 0 12px 12px;
      text-align: center;
      padding: 20px;
    }
    .overlay h1 {
      font-size: 1.8rem;
      color: #00f0ff;
      text-shadow: 0 0 15px rgba(0,240,255,0.6);
      margin-bottom: 8px;
    }
    .overlay p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      color: #8e9bb5;
      margin-bottom: 20px;
    }
    .btn-start {
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      border: none;
      color: #000;
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      transition: transform 0.15s;
    }
    .btn-start:hover { transform: scale(1.05); }
    .controls-hint {
      margin-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #5c6882;
    }
    /* Virtual D-pad for mobile */
    .mobile-controls {
      display: none;
      margin-top: 12px;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 6px;
    }
    @media (hover: none) and (pointer: coarse) {
      .mobile-controls { display: grid; }
    }
    .dpad-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      border-radius: 10px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dpad-btn:active { background: rgba(0, 240, 255, 0.3); }
  </style>
</head>
<body>

  <div id="gameContainer">
    <div class="hud">
      <div>SCORE: <span id="scoreVal">0</span></div>
      <div>HIGH: <span id="highVal">0</span></div>
    </div>
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div id="startOverlay" class="overlay">
      <h1>NEON SNAKE 2049</h1>
      <p>Navigate the grid. Consume energy cores. Dominate the leaderboard.</p>
      <button id="startBtn" class="btn-start">INITIALIZE RUN</button>
      <div class="controls-hint">Use [Arrow Keys] or [W, A, S, D] to maneuver</div>
    </div>

    <!-- On-screen mobile controls -->
    <div class="mobile-controls">
      <div></div>
      <button class="dpad-btn" id="btnUp">▲</button>
      <div></div>
      <button class="dpad-btn" id="btnLeft">◄</button>
      <button class="dpad-btn" id="btnDown">▼</button>
      <button class="dpad-btn" id="btnRight">►</button>
    </div>
  </div>

  <script src="../../js/audio.js"></script>
  <script src="../../js/supabase-client.js"></script>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const highVal = document.getElementById('highVal');
    const startOverlay = document.getElementById('startOverlay');
    const startBtn = document.getElementById('startBtn');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let velocity = { x: 0, y: 0 };
    let food = { x: 0, y: 0 };
    let score = 0;
    let highScore = parseInt(localStorage.getItem('guf_snake_high') || '0', 10);
    highVal.textContent = highScore;

    let gameLoop = null;
    let isRunning = false;
    let nextMoveQueue = [];

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      velocity = { x: 1, y: 0 };
      nextMoveQueue = [];
      score = 0;
      scoreVal.textContent = score;
      placeFood();
    }

    function placeFood() {
      food.x = Math.floor(Math.random() * TILE_COUNT);
      food.y = Math.floor(Math.random() * TILE_COUNT);
      // Ensure food doesn't spawn on snake
      for (let segment of snake) {
        if (segment.x === food.x && segment.y === food.y) {
          return placeFood();
        }
      }
    }

    function update() {
      if (!isRunning) return;

      if (nextMoveQueue.length > 0) {
        const next = nextMoveQueue.shift();
        // Prevent 180 reverse
        if (next.x !== -velocity.x || next.y !== -velocity.y) {
          velocity = next;
        }
      }

      const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        return gameOver();
      }

      // Self collision
      for (let part of snake) {
        if (head.x === part.x && head.y === part.y) {
          return gameOver();
        }
      }

      snake.unshift(head);

      // Check food pickup
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        if (window.gufAudio) window.gufAudio.playCoin();
        placeFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear with trail fade
      ctx.fillStyle = '#090c18';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw subtle grid
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
      }

      // Draw food (pulsing neon magenta core)
      ctx.fillStyle = '#ff007f';
      ctx.shadowColor = '#ff007f';
      ctx.shadowBlur = 12;
      ctx.fillRect(food.x * GRID_SIZE + 3, food.y * GRID_SIZE + 3, GRID_SIZE - 6, GRID_SIZE - 6);

      // Draw snake
      snake.forEach((part, index) => {
        if (index === 0) {
          ctx.fillStyle = '#00f0ff';
          ctx.shadowColor = '#00f0ff';
          ctx.shadowBlur = 15;
        } else {
          ctx.fillStyle = '#00b4d8';
          ctx.shadowBlur = 4;
        }
        ctx.fillRect(part.x * GRID_SIZE + 2, part.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
      });

      ctx.shadowBlur = 0; // Reset
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      if (window.gufAudio) window.gufAudio.playGameOver();

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('guf_snake_high', highScore);
        highVal.textContent = highScore;
      }

      // Record to Supabase / Local storage
      if (window.gufStorage) {
        window.gufStorage.submitScore('neon-snake', score);
      }

      startOverlay.innerHTML = `
        <h1 style="color:#ff007f;">RUN TERMINATED</h1>
        <p>FINAL SCORE: ${score} PTS | BEST: ${highScore} PTS</p>
        <button id="startBtn" class="btn-start">RETRY</button>
      `;
      startOverlay.style.display = 'flex';
      document.getElementById('startBtn').addEventListener('click', startGame);
    }

    function startGame() {
      resetGame();
      startOverlay.style.display = 'none';
      isRunning = true;
      if (window.gufAudio) window.gufAudio.initContext();
      clearInterval(gameLoop);
      gameLoop = setInterval(update, 110);
    }

    startBtn.addEventListener('click', startGame);

    // Controls
    window.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowUp':
        case 'w':
        case 'W':
          if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: -1 });
          break;
        case 'ArrowDown':
        case 's':
        case 'S':
          if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: 1 });
          break;
        case 'ArrowLeft':
        case 'a':
        case 'A':
          if (velocity.x === 0) nextMoveQueue.push({ x: -1, y: 0 });
          break;
        case 'ArrowRight':
        case 'd':
        case 'D':
          if (velocity.x === 0) nextMoveQueue.push({ x: 1, y: 0 });
          break;
      }
    });

    // Touch D-Pad
    document.getElementById('btnUp').addEventListener('touchstart', (e) => { e.preventDefault(); if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: -1 }); });
    document.getElementById('btnDown').addEventListener('touchstart', (e) => { e.preventDefault(); if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: 1 }); });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); if (velocity.x === 0) nextMoveQueue.push({ x: -1, y: 0 }); });
    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); if (velocity.x === 0) nextMoveQueue.push({ x: 1, y: 0 }); });
    document.getElementById('btnUp').addEventListener('click', () => { if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: -1 }); });
    document.getElementById('btnDown').addEventListener('click', () => { if (velocity.y === 0) nextMoveQueue.push({ x: 0, y: 1 }); });
    document.getElementById('btnLeft').addEventListener('click', () => { if (velocity.x === 0) nextMoveQueue.push({ x: -1, y: 0 }); });
    document.getElementById('btnRight').addEventListener('click', () => { if (velocity.x === 0) nextMoveQueue.push({ x: 1, y: 0 }); });

    // Initial render
    resetGame();
    draw();
  </script>
</body>
</html>
